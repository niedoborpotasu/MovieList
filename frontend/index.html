<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MovieList</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header id="main-header"></header>
    <main>
        <div class="hero-banner">
            <img src="img/banner.png">
        </div>

        <div class="trending-section container">
            <div class="trending-header">
                <h2>Trending movies</h2>
                <div class="filter-buttons">
                    <button class="filter-btn active" onclick="switchFilter('today')">Today</button>
                    <button class="filter-btn" onclick="switchFilter('year')">This Year</button>
                    <button class="filter-btn" onclick="switchFilter('all')">All Time</button>
                </div>
            </div>
            <div class="trending-main">
                <div class="movies-grid" id="moviesGrid"></div>
                <div class="load-more-container" style="text-align: center; margin: 30px 0;">
                    <button id="homeLoadMoreBtn" class="load-more-btn" style="display: none;">Load more movies</button>
                </div>
            </div>
        </div>



    </main>

    <script src="js/header.js"></script>
    <script src="js/data.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
