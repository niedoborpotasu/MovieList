<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movies - MovieList</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header id="main-header"></header>

    <main class="container">
        <div class="movies-filter-panel">
            <div class="search-box-large">
                <input type="text" placeholder="Search by title, director or actor...">
            </div>

            <div class="filter-row">
                <select class="filter-select">
                    <option value="">All genres</option>
                    <option value="28">Action</option>
                    <option value="878">Sci-Fi</option>
                    <option value="18">Drama</option>
                    <option value="27">Horror</option>
                    <option value="35">Comedy</option>
                    <option value="16">Animation</option>
                </select>

                <select class="filter-select">
                    <option value="">All years</option>
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2020">2020</option>
                    <option value="1999">1999</option>
                </select>

                <select class="filter-select">
                    <option value="popularity.desc">Most popular</option>
                    <option value="vote_average.desc">Highest rated</option>
                    <option value="primary_release_date.desc">Newest</option>
                </select>
            </div>
        </div>

        <div class="movies-results-grid"></div>
        <div class="load-more-container" style="text-align: center; margin: 35px 0;">
            <button id="loadMoreBtn" class="filter-btn active" style="padding: 10px 30px; font-size: 15px; cursor: pointer; display: none;">Load more movies</button>
        </div>
    </main>

    <script src="js/header.js"></script>
    <script src="js/data.js"></script>
    <script src="js/movies.js"></script>
</body>
</html>
