<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>MovieList</title>

</head>
<body>
    <header>
        <nav class="navbar container">

            <a href="#" class="logo-link">
                <img src="img/filmweb.png" class="logo"> 
            </a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="#">Movies</a></li>
                <li><a href="ranking.html">Your ranking</a></li>

            </ul>

            </div>

    <main>
        
        <div class="status-filters">
            <label class="filter-checkbox">
                <input type="checkbox" name="status" value="watching">
                <span>Watching</span>
            </label>
            <label class="filter-checkbox">
                <input type="checkbox" name="status" value="completed">
                <span>Completed</span>
            </label>
            <label class="filter-checkbox">
                <input type="checkbox" name="status" value="to-watch">
                <span>To Watch</span>
            </label>
            <label class="filter-checkbox">
                <input type="checkbox" name="status" value="dropped">
                <span>Dropped</span>
            </label>
        </div>


    </main>
