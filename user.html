<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>User Profile - MovieList</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header id="main-header"></header>

    <main>
        <div class="banner-section">
            <img src="img/ironman1.jpg" class="profile-banner">
            <div class="profile-section">
                <img src="img/stark_pfp.jpg" class="profile-pfp">
                <div class="info-holder">
                    <h1 class="profile-username" id="profileUsername">Tony Stark</h1>
                    <p class="profile-bio" id="profileBio">Genius, billionaire, playboy, philanthropist.</p>
                </div>
            </div>
        </div>
    </main>

    <script src="js/header.js"></script>
</body>
</html>
