<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>MovieList</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header id="main-header"></header>
    <main>
        <div class="hero-banner">
            <img src="img/banner.png">
        </div>

        <div class="trending-section container">
            <div class="trending-header">
                <h2>Most popular</h2>
                <div class="filter-buttons">
                    <button class="filter-btn active" onclick="switchFilter('all')">All Time</button>
                    <button class="filter-btn" onclick="switchFilter('year')">This Year</button>
                </div>
            </div>
            <div class="trending-main">
                <div class="movies-grid" id="moviesGrid">
                    <div class="movie-card" title="Inception"><img src="posters/inception.jpg" alt="Inception"></div>
                    <div class="movie-card" title="Interstellar"><img src="posters/interstellar.jpg" alt="Interstellar"></div>
                    <div class="movie-card" title="The Dark Knight"><img src="posters/dark_knight.jpg" alt="The Dark Knight"></div>
                    <div class="movie-card" title="Pulp Fiction">Pulp Fiction</div>
                    <div class="movie-card" title="The Conjuring"><img src="posters/the_conjuring.jpg" alt="The Conjuring"></div>
                    <div class="movie-card" title="Fight Club"><img src="posters/fight_club.jpg" alt="Fight Club"></div>
                    <div class="movie-card" title="The Matrix">The Matrix</div>
                    <div class="movie-card" title="Gladiator"><img src="posters/gladiator.jpg" alt="Gladiator"></div>
                    <div class="movie-card" title="Avatar 3">Avatar 3</div>
                    <div class="movie-card" title="Avengers: Doomsday">Avengers: Doomsday</div>
                </div>
                <button class="expand-btn" id="expandBtn" onclick="toggleMovies()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </button>
            </div>
        </div>



    </main>

    <script src="js/header.js"></script>
    <script src="js/data.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
