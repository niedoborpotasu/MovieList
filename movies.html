<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movies - MovieList</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header id="main-header"></header>

    <main class="container">
        <div class="movies-filter-panel">
            <div class="search-box-large">
                <input type="text" placeholder="Search by title, director or actor...">
            </div>

            <div class="filter-row">
                <select class="filter-select">
                    <option value="">All genres</option>
                    <option value="action">Action</option>
                    <option value="scifi">Sci-Fi</option>
                    <option value="drama">Drama</option>
                    <option value="horror">Horror</option>
                </select>

                <select class="filter-select">
                    <option value="">All years</option>
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                    <option value="older">Older</option>
                </select>

                <select class="filter-select">
                    <option value="">Sort by</option>
                    <option value="popular">Most popular</option>
                    <option value="rating">Highest rated</option>
                    <option value="newest">Newest</option>
                </select>
            </div>
        </div>

        <div class="movies-results-grid">
            <p>Type a phrase or choose filters to display results...</p>
        </div>
    </main>

    <script src="js/header.js"></script>
    <script src="js/data.js"></script>
    <script src="js/movies.js"></script>
</body>
</html>
