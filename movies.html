<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Movies - MovieList</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header id="main-header"></header>

    <main class="container">
        <h1>Przeglądaj bazę filmów</h1>

        <div class="movies-filter-panel">
            <div class="search-box-large">
                <input type="text" placeholder="Szukaj tytułu, reżysera lub aktora...">
            </div>

            <div class="filter-row">
                <select class="filter-select">
                    <option value="">Wszystkie gatunki</option>
                    <option value="action">Akcja</option>
                    <option value="scifi">Sci-Fi</option>
                    <option value="drama">Dramat</option>
                    <option value="horror">Horror</option>
                </select>

                <select class="filter-select">
                    <option value="">Wszystkie lata</option>
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                    <option value="older">Starsze</option>
                </select>

                <select class="filter-select">
                    <option value="">Sortuj według</option>
                    <option value="popular">Najpopularniejsze</option>
                    <option value="rating">Najwyżej oceniane</option>
                    <option value="newest">Najnowsze</option>
                </select>
            </div>
        </div>

        <div class="movies-results-grid">
            <p>Wpisz frazę lub wybierz filtry, aby wyświetlić wyniki...</p>
        </div>
    </main>

    <script src="scripts.js"></script>
</body>
</html>
